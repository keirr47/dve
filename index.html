<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="dve sp1.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.png" shadow-intensity="1" camera-orbit="172.1deg 66.59deg 0.6349m" field-of-view="30deg" auto-rotate>
      <button class="Hotspot" slot="hotspot-2" data-position="-0.02643720370187872m 0.26867675042599937m 0.02509756660136203m" data-normal="-6.93889390390723e-18m 0.9795442877392546m 0.2012286966548178m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Handle</div>
      </button><button class="Hotspot" slot="hotspot-4" data-position="-0.06812669083828342m 0.04140680005935016m 0.020799309152613757m" data-normal="-0.7925578649491506m -0.38234669920563497m 0.4750400323275921m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Base</div>
      </button><button class="Hotspot" slot="hotspot-6" data-position="-0.007478416616467213m 0.08737399608705348m 0.06069585202846768m" data-normal="4.8572257327351153e-17m 1m 2.220446049250313e-16m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Disc</div>
      </button><button class="Hotspot" slot="hotspot-7" data-position="-0.08152527062088852m 0.10841029954419465m -0.03024341583946527m" data-normal="-0.959324668122669m 0.14816571203525727m -0.24029794611776445m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Body
          </div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>
